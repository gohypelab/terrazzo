name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruby:
    name: Ruby unit specs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json

      - name: Build the terrazzo npm package
        working-directory: npm
        run: |
          npm ci
          npm run build

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: spec/example_app

      - name: Install example app JavaScript dependencies
        working-directory: spec/example_app
        run: npm install

      - name: Audit example app JavaScript dependencies
        working-directory: spec/example_app
        run: npm run audit

      - name: Build the admin panel from the recipe (also compiles assets)
        working-directory: spec/example_app
        run: script/build_example_admin

      - name: Prepare the test database
        working-directory: spec/example_app
        run: bin/rails db:test:prepare

      - name: Run Ruby package checks
        run: bundle exec rake check

  npm:
    name: npm package checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run package checks
        run: npm run check

  docs:
    name: Docs build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run docs checks
        run: npm run check

  system:
    name: Example app system specs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: browser-actions/setup-chrome@v1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: spec/example_app

      - name: Build the terrazzo npm package
        working-directory: npm
        run: |
          npm ci
          npm run build

      - name: Install example app JavaScript dependencies
        working-directory: spec/example_app
        run: npm install

      - name: Audit example app JavaScript dependencies
        working-directory: spec/example_app
        run: npm run audit

      - name: Build the admin panel from the recipe (also compiles assets)
        working-directory: spec/example_app
        run: script/build_example_admin

      - name: Prepare the test database
        working-directory: spec/example_app
        run: bin/rails db:test:prepare

      - name: Run system specs
        working-directory: spec/example_app
        run: bundle exec rspec
